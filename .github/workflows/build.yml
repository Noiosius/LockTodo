name: Build APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore pinned LockTodo signing key
        id: locktodo-signing-key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: locktodo-stable-debug-keystore-v1

      - name: Verify pinned LockTodo signing certificate
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.android/debug.keystore"
          EXPECTED="5C8A58E44AC2F1619CA20702FE7DD84A8DC64F5EB57B0FEFF9818A8C690BC52B"

          if [ ! -f "$KEYSTORE" ]; then
            echo "::error::Pinned LockTodo signing key is missing. Refusing to generate a replacement key."
            exit 1
          fi

          keytool -exportcert             -keystore "$KEYSTORE"             -storepass android             -alias androiddebugkey             -file /tmp/locktodo-signing-cert.der >/dev/null 2>&1

          ACTUAL="$(sha256sum /tmp/locktodo-signing-cert.der | awk '{print toupper($1)}')"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::LockTodo signing certificate mismatch. Refusing to build an incompatible APK."
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi

          echo "Pinned LockTodo signing certificate verified."

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug :batterycheck:assembleDebug :daycount:assembleDebug :quiethome:assembleDebug :widgetalign:assembleDebug :vibedrain:assembleDebug :igdm:assembleDebug

      - name: Upload LockTodo APK
        uses: actions/upload-artifact@v4
        with:
          name: LockTodo-v0.9.7-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Battery Check APK
        uses: actions/upload-artifact@v4
        with:
          name: Battery-Check-v1.5-apk
          path: batterycheck/build/outputs/apk/debug/batterycheck-debug.apk
          if-no-files-found: error

      - name: Upload Day Count APK
        uses: actions/upload-artifact@v4
        with:
          name: Day-Count-v0.3-apk
          path: daycount/build/outputs/apk/debug/daycount-debug.apk
          if-no-files-found: error

      - name: Upload Quiet Home APK
        uses: actions/upload-artifact@v4
        with:
          name: Quiet-Home-v0.1-apk
          path: quiethome/build/outputs/apk/debug/quiethome-debug.apk
          if-no-files-found: error

      - name: Upload Widget Align APK
        uses: actions/upload-artifact@v4
        with:
          name: Widget-Align-v0.2-apk
          path: widgetalign/build/outputs/apk/debug/widgetalign-debug.apk
          if-no-files-found: error

      - name: Upload Vibe Drain APK
        uses: actions/upload-artifact@v4
        with:
          name: Vibe-Drain-v0.7-apk
          path: vibedrain/build/outputs/apk/debug/vibedrain-debug.apk
          if-no-files-found: error

      - name: Upload IG DM APK
        uses: actions/upload-artifact@v4
        with:
          name: Instagram-DM-v0.12-apk
          path: igdm/build/outputs/apk/debug/igdm-debug.apk
          if-no-files-found: error
