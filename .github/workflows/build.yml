name: Build APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: locktodo-stable-debug-keystore-v1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug :batterycheck:assembleDebug :daycount:assembleDebug :quiethome:assembleDebug :widgetalign:assembleDebug

      - name: Upload LockTodo APK
        uses: actions/upload-artifact@v4
        with:
          name: LockTodo-v0.8.6-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Battery Check APK
        uses: actions/upload-artifact@v4
        with:
          name: Battery-Check-v1.5-apk
          path: batterycheck/build/outputs/apk/debug/batterycheck-debug.apk
          if-no-files-found: error

      - name: Upload Day Count APK
        uses: actions/upload-artifact@v4
        with:
          name: Day-Count-v0.2-apk
          path: daycount/build/outputs/apk/debug/daycount-debug.apk
          if-no-files-found: error

      - name: Upload Quiet Home APK
        uses: actions/upload-artifact@v4
        with:
          name: Quiet-Home-v0.1-apk
          path: quiethome/build/outputs/apk/debug/quiethome-debug.apk
          if-no-files-found: error

      - name: Upload Widget Align APK
        uses: actions/upload-artifact@v4
        with:
          name: Widget-Align-v0.2-apk
          path: widgetalign/build/outputs/apk/debug/widgetalign-debug.apk
          if-no-files-found: error
