name: Build APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug :batterycheck:assembleDebug

      - name: Upload LockTodo APK
        uses: actions/upload-artifact@v4
        with:
          name: LockTodo-v0.7-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Battery Check APK
        uses: actions/upload-artifact@v4
        with:
          name: Battery-Check-v0.2-apk
          path: batterycheck/build/outputs/apk/debug/batterycheck-debug.apk
          if-no-files-found: error
