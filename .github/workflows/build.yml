name: Build APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Stage official Android signing tools
        shell: bash
        run: |
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/lib/

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-35
          path: signing-tools/
          if-no-files-found: error

      - name: Build APKs
        run: gradle --no-daemon :app:assembleRelease :batterycheck:assembleDebug :daycount:assembleDebug :quiethome:assembleDebug :widgetalign:assembleDebug :vibedrain:assembleDebug :igdm:assembleDebug

      - name: Upload unsigned LockTodo APK
        uses: actions/upload-artifact@v4
        with:
          name: LockTodo-v0.9.7-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload Battery Check APK
        uses: actions/upload-artifact@v4
        with:
          name: Battery-Check-v1.5-apk
          path: batterycheck/build/outputs/apk/debug/batterycheck-debug.apk
          if-no-files-found: error

      - name: Upload Day Count APK
        uses: actions/upload-artifact@v4
        with:
          name: Day-Count-v0.3-apk
          path: daycount/build/outputs/apk/debug/daycount-debug.apk
          if-no-files-found: error

      - name: Upload Quiet Home APK
        uses: actions/upload-artifact@v4
        with:
          name: Quiet-Home-v0.1-apk
          path: quiethome/build/outputs/apk/debug/quiethome-debug.apk
          if-no-files-found: error

      - name: Upload Widget Align APK
        uses: actions/upload-artifact@v4
        with:
          name: Widget-Align-v0.2-apk
          path: widgetalign/build/outputs/apk/debug/widgetalign-debug.apk
          if-no-files-found: error

      - name: Upload Vibe Drain APK
        uses: actions/upload-artifact@v4
        with:
          name: Vibe-Drain-v0.7-apk
          path: vibedrain/build/outputs/apk/debug/vibedrain-debug.apk
          if-no-files-found: error

      - name: Upload IG DM APK
        uses: actions/upload-artifact@v4
        with:
          name: Instagram-DM-v0.12-apk
          path: igdm/build/outputs/apk/debug/igdm-debug.apk
          if-no-files-found: error
