name: IG DM candidate
on:
  push:
    branches: ['codex/igdm-minimal-v04']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  igdm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache/restore@v4
        id: signing
        with:
          path: ~/.android/debug.keystore
          key: locktodo-stable-debug-keystore-v1
      - name: Require existing signing identity
        run: test -f ~/.android/debug.keystore
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :igdm:testDebugUnitTest :igdm:lintDebug :igdm:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: IG-DM-v0.4-candidate
          path: igdm/build/outputs/apk/debug/igdm-debug.apk
          if-no-files-found: error
