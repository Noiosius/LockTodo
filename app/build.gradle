plugins {
    id 'com.android.application'
}

android {
    namespace 'com.locktodo.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.locktodo.app'
        minSdk 28
        targetSdk 33
        versionCode 22
        versionName '0.9.7'
    }

    signingConfigs {
        lockTodoStable {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.lockTodoStable
        }
        release {
            minifyEnabled false
        }
    }
}
