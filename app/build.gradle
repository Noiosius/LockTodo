plugins {
    id 'com.android.application'
}

android {
    namespace 'com.locktodo.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.locktodo.app'
        minSdk 28
        targetSdk 33
        versionCode 13
        versionName '0.8.5'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
