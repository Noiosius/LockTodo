plugins {
    id 'com.android.application'
}

android {
    namespace 'com.noiosius.igdm'
    compileSdk 35

    defaultConfig {
        applicationId 'com.noiosius.igdm'
        minSdk 28
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
}
